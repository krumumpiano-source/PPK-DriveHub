name: Sync Google Form to DriveHub

on:
  schedule:
    # รันทุกชั่วโมง เฉพาะช่วงเวลาทำการโรงเรียน 06:00 - 18:00 (UTC 23:00 - 11:00) จันทร์-ศุกร์ เพื่อประหยัดโควตา D1
    - cron: '0 0-11,23 * * 1-5'
  workflow_dispatch:    # ให้กดรันมือได้จาก Actions tab หรือผ่านหน้าเว็บ DriveHub


jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync endpoint
        run: |
          set -e
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "X-Cron-Token: ${{ secrets.SYNC_CRON_TOKEN }}" \
            "https://ppk-drivehub.pages.dev/api/cron/sync-google-forms")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            exit 1
          fi
