<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>หนังสือเตือนของฉัน - PPK DriveHub</title>
    <script src="config.js"></script>
    <script>window.API_BASE_URL=CONFIG.API_BASE_URL;window.currentPage='driver-warnings';window.REQUIRE_AUTH=true;</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="js/api.js"></script><script src="common.js"></script>
    <style>
        .back-btn{cursor:pointer;color:var(--color-primary);font-weight:500;display:inline-flex;align-items:center;gap:4px;margin-bottom:1rem;text-decoration:none}
        .warning-card { border-left: 5px solid var(--color-danger); }
        .warning-card.acknowledged { border-left: 5px solid var(--color-success); opacity: 0.8; }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <div class="container py-4">
        <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> กลับหน้าหลัก</a>

        <div class="row mb-4">
            <div class="col-12">
                <h2><i class="fa-solid fa-envelope-open-text text-danger"></i> เอกสารแจ้งเตือนของฉัน</h2>
                <p class="text-muted">กรุณาอ่านและกดยอมรับทราบข้อความแจ้งเตือนจากคณะกรรมการโรงเรียน</p>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="row" id="warningsList">
            <div class="col-12 text-center p-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">กำลังโหลดข้อมูล...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) {
                window.location.href = 'login.html';
                return;
            }
            window.currentUser = getCurrentUser();
            
            // Allow both drivers and admins (for testing) to see this
            const role = window.currentUser.role;
            if (role !== 'driver' && role !== 'admin' && role !== 'super_admin') {
                Swal.fire('ปฏิเสธการเข้าถึง', 'หน้านี้สำหรับพนักงานขับรถเท่านั้น', 'error').then(() => {
                    window.location.href = '/dashboard.html';
                });
                return;
            }

            await loadMyWarnings();
        });

        async function loadMyWarnings() {
            try {
                // We'll use the driver's own ID. We need to fetch it from their profile if they are a driver.
                // Assuming `window.currentUser.driver_id` is available, if not we fetch pending directly
                
                const res = await API.request(`/api/warnings/pending`);
                const container = document.getElementById('warningsList');
                container.innerHTML = '';
                
                if (!res.data || res.data.length === 0) {
                    container.innerHTML = `
                        <div class="col-12 text-center p-5 bg-white rounded shadow-sm border">
                            <i class="fa-regular fa-circle-check fa-4x text-success mb-3"></i>
                            <h4 class="text-muted">ไม่มีเอกสารแจ้งเตือนที่ต้องรับทราบ</h4>
                            <p class="text-muted">ขอบคุณที่ปฏิบัติหน้าที่อย่างดีเยี่ยม</p>
                        </div>
                    `;
                    return;
                }

                res.data.forEach(w => {
                    let typeLabel = '';
                    let icon = '';
                    if(w.warning_type === 'verbal_record') { typeLabel = 'บันทึกตักเตือนด้วยวาจา'; icon = 'fa-comment-dots'; }
                    else if(w.warning_type === 'written_warning') { typeLabel = 'หนังสือเตือน'; icon = 'fa-file-lines'; }
                    else { typeLabel = 'หนังสือแจ้งผิดสัญญา/TOR'; icon = 'fa-file-signature'; }

                    const div = document.createElement('div');
                    div.className = 'col-md-6 mb-4';
                    div.innerHTML = `
                        <div class="card shadow-sm warning-card h-100">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h5 class="card-title text-danger mb-0"><i class="fa-solid ${icon}"></i> ${typeLabel}</h5>
                                    <span class="badge bg-light text-dark">${formatDate(w.created_at)}</span>
                                </div>
                                <div class="mb-3 p-3 bg-light rounded border">
                                    <strong>ข้อบกพร่อง/สาเหตุ:</strong><br>
                                    ${w.reason}
                                </div>
                                ${w.pip_start_date ? `
                                <div class="alert alert-warning py-2 mb-3">
                                    <i class="fa-solid fa-clock"></i> <strong>ระยะเวลาประเมินซ้ำ:</strong><br>
                                    ตั้งแต่วันที่ ${formatDate(w.pip_start_date)} ถึง ${formatDate(w.pip_end_date)}
                                </div>` : ''}
                                <p class="small text-muted mb-4">
                                    ออกโดย: ${w.issued_by_name || 'คณะกรรมการ'}<br>
                                    <em>* การกดยอมรับทราบนี้ ถือเป็นหลักฐานทางกฎหมายว่าท่านได้รับทราบข้อบกพร่องตามระเบียบของโรงเรียนแล้ว</em>
                                </p>
                                <button class="btn btn-danger w-100 fw-bold" onclick="acknowledgeWarning('${w.id}')">
                                    <i class="fa-solid fa-signature"></i> ข้าพเจ้าขอรับทราบข้อความเตือนนี้
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
                document.getElementById('warningsList').innerHTML = `
                    <div class="col-12 text-center text-danger">
                        เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}
                    </div>
                `;
            }
        }

        async function acknowledgeWarning(id) {
            Swal.fire({
                title: 'ยืนยันการรับทราบ?',
                text: "ข้าพเจ้ารับทราบข้อความเตือนและจะนำไปปรับปรุงแก้ไข",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'ยืนยันรับทราบ',
                cancelButtonText: 'ยกเลิก'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        Swal.showLoading();
                        await API.request(`/api/warnings/${id}/acknowledge`, { method: 'POST' });
                        Swal.fire('บันทึกสำเร็จ', 'ขอบคุณที่รับทราบข้อความเตือน', 'success');
                        await loadMyWarnings();
                    } catch (err) {
                        console.error(err);
                        Swal.fire('ข้อผิดพลาด', err.message, 'error');
                    }
                }
            });
        }
    </script>
</body>
</html>
