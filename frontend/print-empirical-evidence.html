<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>เอกสารข้อมูลสถิติเชิงประจักษ์ประกอบการประเมินผล - PPK DriveHub</title>
    <script src="config.js"></script>
    <script>window.API_BASE_URL=CONFIG.API_BASE_URL;window.currentPage='print-empirical-evidence';window.REQUIRE_AUTH=true;</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="js/api.js"></script>
    <script src="common.js"></script>
    <style>
        body { background: #f8fafc; font-size: 13px; color: #000; font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif; }
        .print-container { max-width: 900px; margin: 0 auto; padding: 25px; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        .header-section { text-align: center; margin-bottom: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .header-section h4 { font-weight: bold; margin-bottom: 4px; font-size: 17px; }
        .header-section h5 { font-weight: bold; margin-bottom: 4px; font-size: 15px; }
        
        .rubric-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .rubric-table th, .rubric-table td { border: 1px solid #000; padding: 6px 10px; }
        .rubric-table th { background-color: #f1f5f9; text-align: center; font-weight: bold; }
        
        .signature-line { display: inline-block; border-bottom: 1px solid #000; width: 220px; margin-bottom: 4px; }
        .page-break { page-break-before: always; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #94a3b8; }
        
        .no-print { display: block; margin-bottom: 20px; padding: 15px; background: #e2e8f0; border-radius: 8px; }
        
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; background: #fff; }
            .print-container { width: 100%; max-width: 100%; padding: 0; box-shadow: none; }
            .page-break { page-break-before: always; margin-top: 0; padding-top: 0; border-top: none; }
            @page { margin: 1.2cm; size: portrait; }
        }
    </style>
</head>
<body>
    <div class="print-container">
        
        <!-- Top Control Bar (Hidden on Print) -->
        <div class="no-print">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1"><i class="fa-solid fa-chart-line text-primary me-2"></i> เอกสารข้อมูลสถิติเชิงประจักษ์ประกอบการประเมินผล (Empirical Evidence)</h5>
                    <p class="text-muted small mb-0">รายงานหลักฐานเชิงประจักษ์: สถิติการใช้รถ + บันทึกไมล์ถอยหลัง + Audit Trail + ลายเซ็นรับทราบผล</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary px-4 fw-bold shadow-sm" onclick="window.print()"><i class="fa-solid fa-print me-2"></i> สั่งพิมพ์ A4</button>
                    <a href="driver-performance.html" class="btn btn-secondary">กลับหน้าหลัก</a>
                </div>
            </div>

            <!-- Filters -->
            <div class="row g-2 align-items-center bg-white p-3 rounded border">
                <div class="col-md-5">
                    <label class="form-label small fw-bold mb-1">เลือกพนักงานขับรถ:</label>
                    <select class="form-select form-select-sm" id="driverSelector" onchange="handleFilterChange()">
                        <option value="all">-- พิมพ์ทุกคนพร้อมกัน (ทั้ง 4 ท่าน) --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold mb-1">ปีงบประมาณ:</label>
                    <select class="form-select form-select-sm" id="yearSelector" onchange="handleFilterChange()">
                        <!-- Dynamic -->
                    </select>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <label class="form-label small fw-bold d-block mb-1">สลับไปเอกสารชุดอื่น:</label>
                    <a id="linkToScoring" href="print-committee-form.html" class="btn btn-sm btn-outline-success w-100">
                        <i class="fa-solid fa-clipboard-check me-1"></i> ดูแบบประเมินกรรมการ
                    </a>
                </div>
            </div>
        </div>

        <div id="dossierContent">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">กำลังจัดเตรียมเอกสารข้อมูลสถิติเชิงประจักษ์...</p>
            </div>
        </div>

    </div>

    <script>
        let allDrivers = [];
        let currentYear = (new Date().getFullYear() + 543).toString();

        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) {
                window.location.href = 'login.html';
                return;
            }
            window.currentUser = getCurrentUser();
            
            const urlParams = new URLSearchParams(window.location.search);
            const initialDriverId = urlParams.get('driverId') || urlParams.get('driver_id') || 'all';
            const initialYear = urlParams.get('year') || currentYear;
            currentYear = initialYear;

            // Populate Year Dropdown
            const yNum = parseInt(currentYear);
            const yearSelect = document.getElementById('yearSelector');
            yearSelect.innerHTML = `
                <option value="${yNum}" ${currentYear === yNum.toString() ? 'selected' : ''}>ปีงบประมาณ ${yNum}</option>
                <option value="${yNum - 1}" ${currentYear === (yNum - 1).toString() ? 'selected' : ''}>ปีงบประมาณ ${yNum - 1}</option>
                <option value="${yNum - 2}" ${currentYear === (yNum - 2).toString() ? 'selected' : ''}>ปีงบประมาณ ${yNum - 2}</option>
            `;

            try {
                const driversRes = await API.get('/api/drivers');
                const driversList = driversRes.data?.drivers || driversRes.data || [];
                const mainKeywords = ['ชารี', 'ณัฐวุฒิ', 'สมชาย', 'สุรเชษฐ์'];
                allDrivers = driversList.filter(d => d.status === 'active' && mainKeywords.some(k => (d.name || d.first_name || '').includes(k)));

                // Populate Driver Select
                const dSelect = document.getElementById('driverSelector');
                dSelect.innerHTML = '<option value="all">-- พิมพ์ทุกคนพร้อมกัน (ทั้ง 4 ท่าน) --</option>';
                allDrivers.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = `${d.title || ''}${d.first_name || d.name} ${d.last_name || ''}`;
                    if (d.id === initialDriverId) opt.selected = true;
                    dSelect.appendChild(opt);
                });

                if (initialDriverId && initialDriverId !== 'all') {
                    dSelect.value = initialDriverId;
                }

                await renderSelectedContent();

            } catch (err) {
                console.error(err);
                document.getElementById('dossierContent').innerHTML = `<div class="alert alert-danger text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
            }
        });

        async function handleFilterChange() {
            const driverId = document.getElementById('driverSelector').value;
            const year = document.getElementById('yearSelector').value;
            currentYear = year;

            // Update switch link
            document.getElementById('linkToScoring').href = `print-committee-form.html?driverId=${driverId}&year=${year}`;

            // Update URL without reload
            const newUrl = `${window.location.pathname}?driverId=${driverId}&year=${year}`;
            window.history.replaceState({}, '', newUrl);

            await renderSelectedContent();
        }

        async function renderSelectedContent() {
            const driverId = document.getElementById('driverSelector').value;
            const year = document.getElementById('yearSelector').value;
            const container = document.getElementById('dossierContent');
            container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">กำลังโหลดข้อมูลสถิติ...</p></div>';

            let driversToRender = [];
            if (driverId === 'all') {
                driversToRender = allDrivers;
            } else {
                const single = allDrivers.find(d => d.id === driverId);
                if (single) driversToRender = [single];
            }

            if (driversToRender.length === 0) {
                container.innerHTML = '<div class="alert alert-danger text-center">ไม่พบข้อมูลพนักงานขับรถยนต์</div>';
                return;
            }

            let html = '';
            for (let i = 0; i < driversToRender.length; i++) {
                const d = driversToRender[i];
                const isNotFirst = i > 0;
                html += await buildEmpiricalEvidenceHtml(d, year, isNotFirst);
            }

            container.innerHTML = html;
        }

        async function buildEmpiricalEvidenceHtml(driver, year, addPageBreakBefore) {
            let evalData = {};
            let empData = {};
            try {
                const [eRes, mRes] = await Promise.all([
                    API.get(`/api/evaluations/driver/${driver.id}?year=${year}`),
                    API.get(`/api/evaluations/empirical/${driver.id}?year=${year}`)
                ]);
                evalData = eRes.data || {};
                empData = mRes.data || {};
            } catch (e) {
                console.warn(e);
            }

            const passengerScore = evalData.passenger_weighted ? evalData.passenger_weighted.toFixed(2) : '0.00';
            const passengerTrips = evalData.passenger_stats?.total_trips || 0;
            const totalTrips = evalData.usage_stats?.total_completed_trips || 0;
            const missedLogs = evalData.usage_stats?.missed_logs || 0;
            const anomalousLogs = evalData.usage_stats?.anomalous_logs || empData.anomalous_count || 0;

            const missedList = empData.missed_details || [];
            let missedRows = '';
            if (missedList.length > 0) {
                missedList.forEach(m => {
                    missedRows += `
                        <tr>
                            <td class="text-center">${m.date || '-'}</td>
                            <td class="text-center">${m.car || '-'}</td>
                            <td>${m.mission || '-'}</td>
                            <td class="text-danger fw-bold">${m.missed || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                missedRows = '<tr><td colspan="4" class="text-center text-success py-2"><i class="fa-solid fa-circle-check"></i> ไม่พบประวัติการละเลยการบันทึกข้อมูลการใช้ยานพาหนะ (ครบถ้วน 100%)</td></tr>';
            }

            const anomalousList = empData.anomalous_details || [];
            let anomalousRows = '';
            if (anomalousList.length > 0) {
                anomalousList.forEach(a => {
                    anomalousRows += `
                        <tr>
                            <td class="text-center">${a.date || '-'}</td>
                            <td class="text-center">${a.car || '-'}</td>
                            <td>${a.mission || '-'}</td>
                            <td class="text-danger fw-bold">${a.reason || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                anomalousRows = '<tr><td colspan="4" class="text-center text-success py-2"><i class="fa-solid fa-circle-check"></i> ไม่พบประวัติการบันทึกเลขไมล์ขัดแย้งกับความเป็นจริง (ถูกต้องตามมาตรฐาน 100%)</td></tr>';
            }

            return `
                <div class="${addPageBreakBefore ? 'page-break' : ''}">
                    <!-- เอกสารข้อมูลสถิติเชิงประจักษ์ประกอบการพิจารณาผลการปฏิบัติหน้าที่ -->
                    <div class="header-section">
                        <h4>ข้อมูลสถิติเชิงประจักษ์ประกอบการประเมินผลการปฏิบัติหน้าที่ (Empirical Evidence)</h4>
                        <h5>เอกสารแนบประกอบการพิจารณา: ${driver.title || ''}${driver.first_name || driver.name || ''} ${driver.last_name || ''}</h5>
                        <p class="mb-0 small text-muted">ข้อมูลสถิติดึงจากระบบฐานข้อมูลกลาง PPK DriveHub ณ วันที่ ${new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })} (ประจำปีงบประมาณ ${year})</p>
                    </div>

                    <!-- 1. สรุปคะแนนผู้โดยสาร -->
                    <h6 class="fw-bold mb-2"><i class="fa-solid fa-star text-warning"></i> 1. สรุปผลการประเมินความพึงพอใจจากผู้รับบริการ (ผู้โดยสาร):</h6>
                    <table class="rubric-table mb-3">
                        <tr>
                            <td style="width: 35%; background: #f8fafc; font-weight: bold;">คะแนนเฉลี่ยจากผู้รับบริการ:</td>
                            <td class="fw-bold text-primary">${passengerScore} / เต็ม 40 คะแนน</td>
                            <td style="width: 25%; background: #f8fafc; font-weight: bold;">จำนวนครั้งที่ได้รับการประเมิน:</td>
                            <td>${passengerTrips} ครั้ง</td>
                        </tr>
                    </table>

                    <!-- 2. สถิติการวิ่งงานและการบันทึกข้อมูล -->
                    <h6 class="fw-bold mb-2"><i class="fa-solid fa-car text-primary"></i> 2. สรุปสถิติการปฏิบัติหน้าที่และการบันทึกข้อมูลการใช้ยานพาหนะ:</h6>
                    <table class="rubric-table mb-3">
                        <tr>
                            <td style="width: 20%; background: #f8fafc; font-weight: bold;">ปฏิบัติภารกิจสำเร็จ:</td>
                            <td class="text-center fw-bold">${totalTrips} คิว</td>
                            <td style="width: 20%; background: #f8fafc; font-weight: bold;">ไม่บันทึกข้อมูลการใช้รถ:</td>
                            <td class="text-center fw-bold ${missedLogs > 0 ? 'text-danger' : 'text-success'}">${missedLogs} ครั้ง</td>
                            <td style="width: 20%; background: #f8fafc; font-weight: bold;">บันทึกเลขไมล์ขัดแย้ง (ถอยหลัง):</td>
                            <td class="text-center fw-bold ${anomalousLogs > 0 ? 'text-danger' : 'text-success'}">${anomalousLogs} ครั้ง</td>
                        </tr>
                    </table>

                    <!-- 3. รายการเลขไมล์ขัดแย้ง -->
                    <h6 class="fw-bold mb-2"><i class="fa-solid fa-triangle-exclamation text-danger"></i> 3. รายการบันทึกเลขไมล์ขัดแย้งกับความเป็นจริง (เลขไมล์ขากลับน้อยกว่าขาออก):</h6>
                    <table class="rubric-table mb-3" style="font-size: 11px;">
                        <thead>
                            <tr style="background:#fee2e2;">
                                <th style="width: 18%;">วันที่</th>
                                <th style="width: 15%;">ทะเบียนยานพาหนะ</th>
                                <th>ภารกิจราชการ / สถานที่</th>
                                <th style="width: 38%;">ลักษณะความผิดปกติที่ตรวจพบ</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${anomalousRows}
                        </tbody>
                    </table>

                    <!-- 4. รายการละเลยการบันทึกข้อมูล -->
                    <h6 class="fw-bold mb-2"><i class="fa-solid fa-magnifying-glass text-secondary"></i> 4. รายการประวัติการไม่บันทึกข้อมูลการใช้ยานพาหนะ (Audit Trail):</h6>
                    <table class="rubric-table mb-4" style="font-size: 11px;">
                        <thead>
                            <tr>
                                <th style="width: 18%;">วันที่</th>
                                <th style="width: 15%;">ทะเบียนยานพาหนะ</th>
                                <th>ภารกิจราชการ / สถานที่</th>
                                <th style="width: 28%;">รายการที่ไม่ได้ดำเนินการบันทึก</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${missedRows}
                        </tbody>
                    </table>

                    <!-- 5. การลงนามรับทราบผล -->
                    <div class="p-3 border rounded bg-light mt-4">
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-signature text-secondary"></i> 5. การลงนามรับทราบผลการประเมินการปฏิบัติหน้าที่:</h6>
                        <p class="small mb-3">ข้าพเจ้าได้รับทราบผลการประเมินการปฏิบัติหน้าที่และข้อมูลสถิติเชิงประจักษ์ข้างต้นเรียบร้อยแล้ว จึงลงลายมือชื่อไว้เป็นหลักฐาน</p>
                        <div class="row align-items-end text-center">
                            <div class="col-6">
                                <div class="signature-line" style="width: 200px;"></div>
                                <p class="small mb-0">ลงชื่อ (${driver.title || ''}${driver.first_name || driver.name || ''} ${driver.last_name || ''})</p>
                                <p class="small text-muted mb-0">พนักงานขับรถยนต์ผู้รับการประเมิน</p>
                            </div>
                            <div class="col-6">
                                <p class="small mb-0">วันที่ .......... / .......... / ..............</p>
                            </div>
                        </div>
                    </div>

                </div>
            `;
        }
    </script>
</body>
</html>
