<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>แบบประเมินผลการปฏิบัติหน้าที่พนักงานขับรถยนต์ - PPK DriveHub</title>
    <script src="config.js"></script>
    <script>window.API_BASE_URL=CONFIG.API_BASE_URL;window.currentPage='print-committee-form';window.REQUIRE_AUTH=true;</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="js/api.js"></script>
    <script src="common.js"></script>
    <style>
        body { background: #f8fafc; font-size: 13px; color: #000; font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif; }
        .print-container { max-width: 900px; margin: 0 auto; padding: 25px; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        .header-section { text-align: center; margin-bottom: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .header-section h4 { font-weight: bold; margin-bottom: 4px; font-size: 17px; }
        .header-section h5 { font-weight: bold; margin-bottom: 4px; font-size: 15px; }
        
        .rubric-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .rubric-table th, .rubric-table td { border: 1px solid #000; padding: 6px 10px; }
        .rubric-table th { background-color: #f1f5f9; text-align: center; font-weight: bold; }
        
        .score-box { width: 90px; text-align: center; vertical-align: middle; font-weight: bold; }
        .score-input-line { border-bottom: 1px dotted #000; display: inline-block; width: 40px; text-align: center; }

        .signature-grid { display: flex; justify-content: space-between; margin-top: 25px; }
        .signature-box { width: 45%; text-align: center; }
        .signature-line { display: inline-block; border-bottom: 1px solid #000; width: 220px; margin-bottom: 4px; }

        .page-break { page-break-before: always; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #94a3b8; }
        
        .no-print { display: block; margin-bottom: 20px; text-align: center; padding: 15px; background: #e2e8f0; border-radius: 8px; }
        
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; background: #fff; }
            .print-container { width: 100%; max-width: 100%; padding: 0; box-shadow: none; }
            .page-break { page-break-before: always; margin-top: 0; padding-top: 15px; border-top: none; }
            @page { margin: 1.2cm; size: portrait; }
        }
    </style>
</head>
<body>
    <div class="print-container">
        
        <div class="no-print">
            <h5 class="fw-bold"><i class="fa-solid fa-print text-primary"></i> ชุดเอกสารประเมินผลการปฏิบัติหน้าที่พนักงานขับรถยนต์ (เอกสารทางการ)</h5>
            <p class="text-muted small mb-3">เอกสารชุดนี้ประกอบด้วย <strong>หน้า 1: แบบประเมินผลและลงนามของคณะกรรมการ</strong> และ <strong>หน้า 2: ข้อมูลสถิติเชิงประจักษ์ + ตรวจสอบความถูกต้องของเลขไมล์ + การลงนามรับทราบผล</strong></p>
            <div class="d-flex justify-content-center gap-2">
                <button class="btn btn-primary btn-lg px-4" onclick="window.print()"><i class="fa-solid fa-print me-2"></i> สั่งพิมพ์ A4 / บันทึก PDF</button>
                <a href="driver-performance.html" class="btn btn-secondary btn-lg">กลับหน้าหลัก</a>
            </div>
        </div>

        <div id="dossierContent">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">กำลังจัดเตรียมชุดเอกสารประเมินผล...</p>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) {
                window.location.href = 'login.html';
                return;
            }
            window.currentUser = getCurrentUser();
            
            const urlParams = new URLSearchParams(window.location.search);
            const driverId = urlParams.get('driverId') || urlParams.get('driver_id');
            const year = urlParams.get('year') || (new Date().getFullYear() + 543).toString();
            const batchAll = urlParams.get('batch') === '1' || urlParams.get('all') === '1';

            try {
                const driversRes = await API.get('/api/drivers');
                const driversList = driversRes.data?.drivers || driversRes.data || [];
                const mainKeywords = ['ชารี', 'ณัฐวุฒิ', 'สมชาย', 'สุรเชษฐ์'];
                const activeDrivers = driversList.filter(d => (d.status === 'active' || d.id === driverId) && mainKeywords.some(k => (d.name || d.first_name || '').includes(k)));

                let driversToRender = [];
                if (batchAll) {
                    driversToRender = activeDrivers;
                } else if (driverId) {
                    const single = activeDrivers.find(d => d.id === driverId);
                    if (single) driversToRender = [single];
                }

                if (driversToRender.length === 0) {
                    document.getElementById('dossierContent').innerHTML = '<div class="alert alert-danger text-center">ไม่พบข้อมูลพนักงานขับรถยนต์</div>';
                    return;
                }

                let html = '';
                for (let i = 0; i < driversToRender.length; i++) {
                    const d = driversToRender[i];
                    const isNotFirst = i > 0;
                    html += await buildDriverDossierHtml(d, year, isNotFirst);
                }

                document.getElementById('dossierContent').innerHTML = html;

            } catch (err) {
                console.error(err);
                document.getElementById('dossierContent').innerHTML = `<div class="alert alert-danger text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
            }
        });

        async function buildDriverDossierHtml(driver, year, addPageBreakBefore) {
            let evalData = {};
            let empData = {};
            try {
                const [eRes, mRes] = await Promise.all([
                    API.get(`/api/evaluations/driver/${driver.id}?year=${year}`),
                    API.get(`/api/evaluations/empirical/${driver.id}?year=${year}`)
                ]);
                evalData = eRes.data || {};
                empData = mRes.data || {};
            } catch (e) {
                console.warn(e);
            }

            const passengerScore = evalData.passenger_weighted ? evalData.passenger_weighted.toFixed(2) : '0.00';
            const passengerTrips = evalData.passenger_stats?.total_trips || 0;
            const totalTrips = evalData.usage_stats?.total_completed_trips || 0;
            const missedLogs = evalData.usage_stats?.missed_logs || 0;
            const anomalousLogs = evalData.usage_stats?.anomalous_logs || empData.anomalous_count || 0;

            const missedList = empData.missed_details || [];
            let missedRows = '';
            if (missedList.length > 0) {
                missedList.forEach(m => {
                    missedRows += `
                        <tr>
                            <td class="text-center">${m.date || '-'}</td>
                            <td class="text-center">${m.car || '-'}</td>
                            <td>${m.mission || '-'}</td>
                            <td class="text-danger fw-bold">${m.missed || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                missedRows = '<tr><td colspan="4" class="text-center text-success py-2"><i class="fa-solid fa-circle-check"></i> ไม่พบประวัติการละเลยการบันทึกข้อมูลการใช้ยานพาหนะ (ครบถ้วน 100%)</td></tr>';
            }

            const anomalousList = empData.anomalous_details || [];
            let anomalousRows = '';
            if (anomalousList.length > 0) {
                anomalousList.forEach(a => {
                    anomalousRows += `
                        <tr>
                            <td class="text-center">${a.date || '-'}</td>
                            <td class="text-center">${a.car || '-'}</td>
                            <td>${a.mission || '-'}</td>
                            <td class="text-danger fw-bold">${a.reason || '-'}</td>
                        </tr>
                    `;
                });
            } else {
                anomalousRows = '<tr><td colspan="4" class="text-center text-success py-2"><i class="fa-solid fa-circle-check"></i> ไม่พบประวัติการบันทึกเลขไมล์ขัดแย้งกับความเป็นจริง (ถูกต้องตามมาตรฐาน 100%)</td></tr>';
            }

            return `
                <div class="${addPageBreakBefore ? 'page-break' : ''}">
                    <!-- หน้าที่ 1: แบบประเมินผลการปฏิบัติหน้าที่ของคณะกรรมการ -->
                    <div class="header-section">
                        <h4>แบบประเมินผลการปฏิบัติหน้าที่พนักงานขับรถยนต์ (ส่วนที่ 2: คณะกรรมการ)</h4>
                        <h5>โรงเรียนพะเยาพิทยาคม ประจำปีการศึกษา ${year}</h5>
                        <p class="mb-0 fw-bold">ชื่อ-สกุล พนักงานขับรถยนต์: ${driver.title || ''}${driver.first_name || driver.name || ''} ${driver.last_name || ''}</p>
                    </div>

                    <p class="fw-bold mb-2">คำชี้แจง: โปรดพิจารณาและประเมินผลการปฏิบัติหน้าที่ตามมาตรฐานตัวชี้วัด โดยกรอกคะแนนที่เหมาะสมลงในช่องว่าง</p>
                    
                    <table class="rubric-table">
                        <thead>
                            <tr>
                                <th style="width: 75%;">หัวข้อการประเมินและเกณฑ์พิจารณา (คะแนนเต็ม 100 คะแนน)</th>
                                <th style="width: 25%;">คะแนนที่ได้</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- หมวดที่ 1 -->
                            <tr class="table-light">
                                <td colspan="2"><strong>1. ด้านการดูแลรักษาและบำรุงรักษายานพาหนะ (คะแนนเต็ม 30 คะแนน)</strong></td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ทำความสะอาดและดูแลสุขอนามัยภายในและภายนอกยานพาหนะอย่างสม่ำเสมอ (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ตรวจสอบความพร้อมของระบบเครื่องยนต์ ของเหลว และอุปกรณ์ความปลอดภัยพื้นฐานก่อนปฏิบัติหน้าที่ (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• นำยานพาหนะเข้ารับการตรวจเช็คระยะ เปลี่ยนถ่ายของเหลว และบำรุงรักษาตามรอบระยะเวลาที่กำหนด (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• สังเกตและรายงานความผิดปกติของยานพาหนะ พร้อมดำเนินการแจ้งซ่อมบำรุงตามขั้นตอนราชการทันที (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• จัดเก็บและจอดพักยานพาหนะในสถานที่ที่สถานศึกษากำหนดอย่างเป็นระเบียบเรียบร้อย (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="text-end fw-bold">รวมคะแนนด้านที่ 1</td>
                                <td class="score-box fw-bold"><span class="score-input-line"></span> / 30</td>
                            </tr>

                            <!-- หมวดที่ 2 -->
                            <tr class="table-light">
                                <td colspan="2"><strong>2. ด้านวินัย จรรยาบรรณ และการปฏิบัติหน้าที่ (คะแนนเต็ม 40 คะแนน)</strong></td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ปฏิบัติหน้าที่ตรงต่อเวลา ไม่ออกนอกสถานศึกษาหรือละทิ้งหน้าที่ในเวลาราชการโดยไม่ได้รับอนุญาต (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ปฏิบัติตามคำสั่งของผู้บังคับบัญชาและระเบียบของสถานศึกษาอย่างเคร่งครัด (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• สถิติการลา (ลากิจ/ลาป่วย) อยู่ในเกณฑ์ที่ระเบียบกำหนด และดำเนินการขออนุญาตลาถูกต้องตามระเบียบสารบรรณ (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3 fw-bold">• บันทึกข้อมูลการใช้ยานพาหนะ (เลขไมล์เข้า-ออก) ถูกต้องครบถ้วน ตรงตามความเป็นจริง และเป็นปัจจุบัน (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• มีความพร้อมในการปฏิบัติหน้าที่ ณ จุดนัดหมาย และดูแลความปลอดภัยของผู้โดยสารตลอดการเดินทาง (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="text-end fw-bold">รวมคะแนนด้านที่ 2</td>
                                <td class="score-box fw-bold"><span class="score-input-line"></span> / 40</td>
                            </tr>

                            <!-- หมวดที่ 3 -->
                            <tr class="table-light">
                                <td colspan="2"><strong>3. ด้านจิตบริการ การอุทิศเวลา และความร่วมมือในองค์กร (คะแนนเต็ม 30 คะแนน)</strong></td>
                            </tr>
                            <tr>
                                <td class="ps-3">• อุทิศเวลาและพร้อมปฏิบัติหน้าที่นอกเวลาราชการหรือภารกิจเร่งด่วนของสถานศึกษา (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ให้ความร่วมมือและช่วยเหลือภารกิจส่วนรวมของสถานศึกษาในช่วงเวลาที่ไม่มีภารกิจการใช้รถ (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• มีมนุษยสัมพันธ์ สุภาพเรียบร้อย และทำงานร่วมกับคณะครู บุคลากร และนักเรียนได้เป็นอย่างดี (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ดูแลรักษาความสะอาดและสุขอนามัยบริเวณโรงจอดรถและพื้นที่ปฏิบัติงาน (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• มีทัศนคติที่ดีต่อสถานศึกษา ปฏิบัติตนตามจรรยาบรรณ และรักษาภาพลักษณ์อันดีขององค์กร (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="text-end fw-bold">รวมคะแนนด้านที่ 3</td>
                                <td class="score-box fw-bold"><span class="score-input-line"></span> / 30</td>
                            </tr>

                            <!-- รวมคะแนน -->
                            <tr style="background-color: #f1f5f9;">
                                <td class="text-end fw-bold fs-6">รวมคะแนนของคณะกรรมการ (นำไปคิดสัดส่วน 60 คะแนนสุทธิในระบบ)</td>
                                <td class="score-box fs-6 fw-bold"><span class="score-input-line"></span> / 100</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="signature-grid">
                        <div class="signature-box">
                            <p class="mb-1">ลงชื่อกรรมการผู้ประเมิน</p>
                            <div class="signature-line"></div>
                            <p class="mb-0 small">(.......................................................................)</p>
                            <p class="small text-muted">ตำแหน่ง คณะกรรมการประเมินผลการปฏิบัติหน้าที่</p>
                        </div>
                        <div class="signature-box">
                            <p class="mb-1">ลงชื่อประธานกรรมการ</p>
                            <div class="signature-line"></div>
                            <p class="mb-0 small">(.......................................................................)</p>
                            <p class="small text-muted">ตำแหน่ง ประธานคณะกรรมการประเมินผลการปฏิบัติหน้าที่</p>
                        </div>
                    </div>

                    <!-- หน้าที่ 2: ข้อมูลสถิติเชิงประจักษ์ประกอบการพิจารณาผลการปฏิบัติหน้าที่ -->
                    <div class="page-break">
                        <div class="header-section">
                            <h4>ข้อมูลสถิติเชิงประจักษ์ประกอบการประเมินผล (Empirical Evidence)</h4>
                            <h5>เอกสารแนบประกอบการพิจารณาผลการปฏิบัติหน้าที่: ${driver.title || ''}${driver.first_name || driver.name || ''} ${driver.last_name || ''}</h5>
                            <p class="mb-0 small text-muted">ข้อมูลสถิติดึงจากระบบฐานข้อมูลกลาง PPK DriveHub ณ วันที่ ${new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>

                        <!-- 1. สรุปคะแนนผู้โดยสาร -->
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-star text-warning"></i> 1. สรุปผลการประเมินความพึงพอใจจากผู้รับบริการ (ผู้โดยสาร):</h6>
                        <table class="rubric-table mb-3">
                            <tr>
                                <td style="width: 35%; background: #f8fafc; font-weight: bold;">คะแนนเฉลี่ยจากผู้รับบริการ:</td>
                                <td class="fw-bold text-primary">${passengerScore} / เต็ม 40 คะแนน</td>
                                <td style="width: 25%; background: #f8fafc; font-weight: bold;">จำนวนครั้งที่ได้รับการประเมิน:</td>
                                <td>${passengerTrips} ครั้ง</td>
                            </tr>
                        </table>

                        <!-- 2. สถิติการวิ่งงานและการบันทึกข้อมูล -->
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-car text-primary"></i> 2. สรุปสถิติการปฏิบัติหน้าที่และการบันทึกข้อมูลการใช้ยานพาหนะ:</h6>
                        <table class="rubric-table mb-3">
                            <tr>
                                <td style="width: 20%; background: #f8fafc; font-weight: bold;">ปฏิบัติภารกิจสำเร็จ:</td>
                                <td class="text-center fw-bold">${totalTrips} คิว</td>
                                <td style="width: 20%; background: #f8fafc; font-weight: bold;">ไม่บันทึกข้อมูลการใช้รถ:</td>
                                <td class="text-center fw-bold ${missedLogs > 0 ? 'text-danger' : 'text-success'}">${missedLogs} ครั้ง</td>
                                <td style="width: 20%; background: #f8fafc; font-weight: bold;">บันทึกเลขไมล์ขัดแย้ง (ถอยหลัง):</td>
                                <td class="text-center fw-bold ${anomalousLogs > 0 ? 'text-danger' : 'text-success'}">${anomalousLogs} ครั้ง</td>
                            </tr>
                        </table>

                        <!-- 3. รายการเลขไมล์ขัดแย้ง -->
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-triangle-exclamation text-danger"></i> 3. รายการบันทึกเลขไมล์ขัดแย้งกับความเป็นจริง (เลขไมล์ขากลับน้อยกว่าขาออก):</h6>
                        <table class="rubric-table mb-3" style="font-size: 11px;">
                            <thead>
                                <tr style="background:#fee2e2;">
                                    <th style="width: 18%;">วันที่</th>
                                    <th style="width: 15%;">ทะเบียนยานพาหนะ</th>
                                    <th>ภารกิจราชการ / สถานที่</th>
                                    <th style="width: 38%;">ลักษณะความผิดปกติที่ตรวจพบ</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${anomalousRows}
                            </tbody>
                        </table>

                        <!-- 4. รายการละเลยการบันทึกข้อมูล -->
                        <h6 class="fw-bold mb-2"><i class="fa-solid fa-magnifying-glass text-secondary"></i> 4. รายการประวัติการไม่บันทึกข้อมูลการใช้ยานพาหนะ (Audit Trail):</h6>
                        <table class="rubric-table mb-4" style="font-size: 11px;">
                            <thead>
                                <tr>
                                    <th style="width: 18%;">วันที่</th>
                                    <th style="width: 15%;">ทะเบียนยานพาหนะ</th>
                                    <th>ภารกิจราชการ / สถานที่</th>
                                    <th style="width: 28%;">รายการที่ไม่ได้ดำเนินการบันทึก</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${missedRows}
                            </tbody>
                        </table>

                        <!-- 5. การลงนามรับทราบผล -->
                        <div class="p-3 border rounded bg-light mt-4">
                            <h6 class="fw-bold mb-2"><i class="fa-solid fa-signature text-secondary"></i> 5. การลงนามรับทราบผลการประเมินการปฏิบัติหน้าที่:</h6>
                            <p class="small mb-3">ข้าพเจ้าได้รับทราบผลการประเมินการปฏิบัติหน้าที่และข้อมูลสถิติเชิงประจักษ์ข้างต้นเรียบร้อยแล้ว จึงลงลายมือชื่อไว้เป็นหลักฐาน</p>
                            <div class="row align-items-end text-center">
                                <div class="col-6">
                                    <div class="signature-line" style="width: 200px;"></div>
                                    <p class="small mb-0">ลงชื่อ (${driver.title || ''}${driver.first_name || driver.name || ''} ${driver.last_name || ''})</p>
                                    <p class="small text-muted mb-0">พนักงานขับรถยนต์ผู้รับการประเมิน</p>
                                </div>
                                <div class="col-6">
                                    <p class="small mb-0">วันที่ .......... / .......... / ..............</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
