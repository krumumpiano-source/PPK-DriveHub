<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>แบบประเมินผลการปฏิบัติหน้าที่พนักงานขับรถยนต์ (คณะกรรมการ) - PPK DriveHub</title>
    <script src="config.js"></script>
    <script>window.API_BASE_URL=CONFIG.API_BASE_URL;window.currentPage='print-committee-form';window.REQUIRE_AUTH=true;</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="common.css">
    <script src="js/api.js"></script>
    <script src="common.js"></script>
    <style>
        body { background: #f8fafc; font-size: 13px; color: #000; font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif; }
        .print-container { max-width: 900px; margin: 0 auto; padding: 25px; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        
        .header-section { text-align: center; margin-bottom: 18px; border-bottom: 2px solid #000; padding-bottom: 10px; }
        .header-section h4 { font-weight: bold; margin-bottom: 4px; font-size: 17px; }
        .header-section h5 { font-weight: bold; margin-bottom: 4px; font-size: 15px; }
        
        .rubric-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        .rubric-table th, .rubric-table td { border: 1px solid #000; padding: 6px 10px; }
        .rubric-table th { background-color: #f1f5f9; text-align: center; font-weight: bold; }
        
        .score-box { width: 90px; text-align: center; vertical-align: middle; font-weight: bold; }
        .score-input-line { border-bottom: 1px dotted #000; display: inline-block; width: 40px; text-align: center; }

        .signature-grid { display: flex; justify-content: space-between; margin-top: 25px; }
        .signature-box { width: 45%; text-align: center; }
        .signature-line { display: inline-block; border-bottom: 1px solid #000; width: 220px; margin-bottom: 4px; }

        .page-break { page-break-before: always; margin-top: 30px; padding-top: 20px; border-top: 2px dashed #94a3b8; }
        
        .no-print { display: block; margin-bottom: 20px; padding: 15px; background: #e2e8f0; border-radius: 8px; }
        
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; background: #fff; }
            .print-container { width: 100%; max-width: 100%; padding: 0; box-shadow: none; }
            .page-break { page-break-before: always; margin-top: 0; padding-top: 0; border-top: none; }
            @page { margin: 1.2cm; size: portrait; }
        }
    </style>
</head>
<body>
    <div class="print-container">
        
        <!-- Top Control Bar (Hidden on Print) -->
        <div class="no-print">
            <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-3">
                <div>
                    <h5 class="fw-bold mb-1"><i class="fa-solid fa-clipboard-check text-success me-2"></i> แบบประเมินผลสำหรับคณะกรรมการ (Scoring Form)</h5>
                    <p class="text-muted small mb-0">แบบฟอร์มลงคะแนนและลงนามสำหรับคณะกรรมการ 5 ท่าน (1 หน้า A4 ต่อคนขับ)</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-primary px-4 fw-bold shadow-sm" onclick="window.print()"><i class="fa-solid fa-print me-2"></i> สั่งพิมพ์ A4</button>
                    <a href="driver-performance.html" class="btn btn-secondary">กลับหน้าหลัก</a>
                </div>
            </div>

            <!-- Filters -->
            <div class="row g-2 align-items-center bg-white p-3 rounded border">
                <div class="col-md-5">
                    <label class="form-label small fw-bold mb-1">เลือกพนักงานขับรถ:</label>
                    <select class="form-select form-select-sm" id="driverSelector" onchange="handleFilterChange()">
                        <option value="all">-- พิมพ์ทุกคนพร้อมกัน (ทั้ง 4 ท่าน) --</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small fw-bold mb-1">ปีงบประมาณ:</label>
                    <select class="form-select form-select-sm" id="yearSelector" onchange="handleFilterChange()">
                        <!-- Dynamic -->
                    </select>
                </div>
                <div class="col-md-4 text-md-end mt-3 mt-md-0">
                    <label class="form-label small fw-bold d-block mb-1">สลับไปเอกสารชุดอื่น:</label>
                    <a id="linkToEmpirical" href="print-empirical-evidence.html" class="btn btn-sm btn-outline-info w-100">
                        <i class="fa-solid fa-chart-line me-1"></i> ดูสถิติเชิงประจักษ์
                    </a>
                </div>
            </div>
        </div>

        <div id="dossierContent">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="mt-2 text-muted">กำลังจัดเตรียมแบบประเมินผล...</p>
            </div>
        </div>

    </div>

    <script>
        let allDrivers = [];
        let currentYear = (new Date().getFullYear() + 543).toString();

        document.addEventListener('DOMContentLoaded', async () => {
            if (!checkAuth()) {
                window.location.href = 'login.html';
                return;
            }
            window.currentUser = getCurrentUser();
            
            const urlParams = new URLSearchParams(window.location.search);
            const initialDriverId = urlParams.get('driverId') || urlParams.get('driver_id') || (urlParams.get('batch') === '1' || urlParams.get('all') === '1' ? 'all' : 'all');
            const initialYear = urlParams.get('year') || currentYear;
            currentYear = initialYear;

            // Populate Year Dropdown
            const yNum = parseInt(currentYear);
            const yearSelect = document.getElementById('yearSelector');
            yearSelect.innerHTML = `
                <option value="${yNum}" ${currentYear === yNum.toString() ? 'selected' : ''}>ปีงบประมาณ ${yNum}</option>
                <option value="${yNum - 1}" ${currentYear === (yNum - 1).toString() ? 'selected' : ''}>ปีงบประมาณ ${yNum - 1}</option>
                <option value="${yNum - 2}" ${currentYear === (yNum - 2).toString() ? 'selected' : ''}>ปีงบประมาณ ${yNum - 2}</option>
            `;

            try {
                const driversRes = await API.get('/api/drivers');
                const driversList = driversRes.data?.drivers || driversRes.data || [];
                const mainKeywords = ['ชารี', 'ณัฐวุฒิ', 'สมชาย', 'สุรเชษฐ์'];
                allDrivers = driversList.filter(d => d.status === 'active' && mainKeywords.some(k => (d.name || d.first_name || '').includes(k)));

                // Populate Driver Select
                const dSelect = document.getElementById('driverSelector');
                dSelect.innerHTML = '<option value="all">-- พิมพ์ทุกคนพร้อมกัน (ทั้ง 4 ท่าน) --</option>';
                allDrivers.forEach(d => {
                    const opt = document.createElement('option');
                    opt.value = d.id;
                    opt.textContent = `${d.title || ''}${d.first_name || d.name} ${d.last_name || ''}`;
                    if (d.id === initialDriverId) opt.selected = true;
                    dSelect.appendChild(opt);
                });

                if (initialDriverId && initialDriverId !== 'all') {
                    dSelect.value = initialDriverId;
                }

                await renderSelectedContent();

            } catch (err) {
                console.error(err);
                document.getElementById('dossierContent').innerHTML = `<div class="alert alert-danger text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${err.message}</div>`;
            }
        });

        async function handleFilterChange() {
            const driverId = document.getElementById('driverSelector').value;
            const year = document.getElementById('yearSelector').value;
            currentYear = year;

            // Update switch link
            document.getElementById('linkToEmpirical').href = `print-empirical-evidence.html?driverId=${driverId}&year=${year}`;

            // Update URL without reload
            const newUrl = `${window.location.pathname}?driverId=${driverId}&year=${year}`;
            window.history.replaceState({}, '', newUrl);

            await renderSelectedContent();
        }

        async function renderSelectedContent() {
            const driverId = document.getElementById('driverSelector').value;
            const year = document.getElementById('yearSelector').value;
            const container = document.getElementById('dossierContent');
            container.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-2 text-muted">กำลังโหลดแบบประเมิน...</p></div>';

            let driversToRender = [];
            if (driverId === 'all') {
                driversToRender = allDrivers;
            } else {
                const single = allDrivers.find(d => d.id === driverId);
                if (single) driversToRender = [single];
            }

            if (driversToRender.length === 0) {
                container.innerHTML = '<div class="alert alert-danger text-center">ไม่พบข้อมูลพนักงานขับรถยนต์</div>';
                return;
            }

            let html = '';
            for (let i = 0; i < driversToRender.length; i++) {
                const d = driversToRender[i];
                const isNotFirst = i > 0;
                html += buildScoringFormHtml(d, year, isNotFirst);
            }

            container.innerHTML = html;
        }

        function buildScoringFormHtml(driver, year, addPageBreakBefore) {
            return `
                <div class="${addPageBreakBefore ? 'page-break' : ''}">
                    <!-- แบบประเมินผลการปฏิบัติหน้าที่ของคณะกรรมการ -->
                    <div class="header-section">
                        <h4>แบบประเมินผลการปฏิบัติหน้าที่พนักงานขับรถยนต์ (ส่วนที่ 2: คณะกรรมการ)</h4>
                        <h5>โรงเรียนพะเยาพิทยาคม ประจำปีการศึกษา ${year}</h5>
                        <p class="mb-0 fw-bold">ชื่อ-สกุล พนักงานขับรถยนต์: ${driver.title || ''}${driver.first_name || driver.name || ''} ${driver.last_name || ''}</p>
                    </div>

                    <p class="fw-bold mb-2">คำชี้แจง: โปรดพิจารณาและประเมินผลการปฏิบัติหน้าที่ตามมาตรฐานตัวชี้วัด โดยกรอกคะแนนที่เหมาะสมลงในช่องว่าง</p>
                    
                    <table class="rubric-table">
                        <thead>
                            <tr>
                                <th style="width: 75%;">หัวข้อการประเมินและเกณฑ์พิจารณา (คะแนนเต็ม 100 คะแนน)</th>
                                <th style="width: 25%;">คะแนนที่ได้</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- หมวดที่ 1 -->
                            <tr class="table-light">
                                <td colspan="2"><strong>1. ด้านการดูแลรักษาและบำรุงรักษายานพาหนะ (คะแนนเต็ม 30 คะแนน)</strong></td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ทำความสะอาดและดูแลสุขอนามัยภายในและภายนอกยานพาหนะอย่างสม่ำเสมอ (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ตรวจสอบความพร้อมของระบบเครื่องยนต์ ของเหลว และอุปกรณ์ความปลอดภัยพื้นฐานก่อนปฏิบัติหน้าที่ (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• นำยานพาหนะเข้ารับการตรวจเช็คระยะ เปลี่ยนถ่ายของเหลว และบำรุงรักษาตามรอบระยะเวลาที่กำหนด (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• สังเกตและรายงานความผิดปกติของยานพาหนะ พร้อมดำเนินการแจ้งซ่อมบำรุงตามขั้นตอนราชการทันที (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• จัดเก็บและจอดพักยานพาหนะในสถานที่ที่สถานศึกษากำหนดอย่างเป็นระเบียบเรียบร้อย (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="text-end fw-bold">รวมคะแนนด้านที่ 1</td>
                                <td class="score-box fw-bold"><span class="score-input-line"></span> / 30</td>
                            </tr>

                            <!-- หมวดที่ 2 -->
                            <tr class="table-light">
                                <td colspan="2"><strong>2. ด้านวินัย จรรยาบรรณ และการปฏิบัติหน้าที่ (คะแนนเต็ม 40 คะแนน)</strong></td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ปฏิบัติหน้าที่ตรงต่อเวลา ไม่ออกนอกสถานศึกษาหรือละทิ้งหน้าที่ในเวลาราชการโดยไม่ได้รับอนุญาต (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ปฏิบัติตามคำสั่งของผู้บังคับบัญชาและระเบียบของสถานศึกษาอย่างเคร่งครัด (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• สถิติการลา (ลากิจ/ลาป่วย) อยู่ในเกณฑ์ที่ระเบียบกำหนด และดำเนินการขออนุญาตลาถูกต้องตามระเบียบสารบรรณ (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3 fw-bold">• บันทึกข้อมูลการใช้ยานพาหนะ (เลขไมล์เข้า-ออก) ถูกต้องครบถ้วน ตรงตามความเป็นจริง และเป็นปัจจุบัน (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• มีความพร้อมในการปฏิบัติหน้าที่ ณ จุดนัดหมาย และดูแลความปลอดภัยของผู้โดยสารตลอดการเดินทาง (8 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 8</td>
                            </tr>
                            <tr>
                                <td class="text-end fw-bold">รวมคะแนนด้านที่ 2</td>
                                <td class="score-box fw-bold"><span class="score-input-line"></span> / 40</td>
                            </tr>

                            <!-- หมวดที่ 3 -->
                            <tr class="table-light">
                                <td colspan="2"><strong>3. ด้านจิตบริการ การอุทิศเวลา และความร่วมมือในองค์กร (คะแนนเต็ม 30 คะแนน)</strong></td>
                            </tr>
                            <tr>
                                <td class="ps-3">• อุทิศเวลาและพร้อมปฏิบัติหน้าที่นอกเวลาราชการหรือภารกิจเร่งด่วนของสถานศึกษา (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ให้ความร่วมมือและช่วยเหลือภารกิจส่วนรวมของสถานศึกษาในช่วงเวลาที่ไม่มีภารกิจการใช้รถ (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• มีมนุษยสัมพันธ์ สุภาพเรียบร้อย และทำงานร่วมกับคณะครู บุคลากร และนักเรียนได้เป็นอย่างดี (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• ดูแลรักษาความสะอาดและสุขอนามัยบริเวณโรงจอดรถและพื้นที่ปฏิบัติงาน (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="ps-3">• มีทัศนคติที่ดีต่อสถานศึกษา ปฏิบัติตนตามจรรยาบรรณ และรักษาภาพลักษณ์อันดีขององค์กร (6 คะแนน)</td>
                                <td class="score-box"><span class="score-input-line"></span> / 6</td>
                            </tr>
                            <tr>
                                <td class="text-end fw-bold">รวมคะแนนด้านที่ 3</td>
                                <td class="score-box fw-bold"><span class="score-input-line"></span> / 30</td>
                            </tr>

                            <!-- รวมคะแนน -->
                            <tr style="background-color: #f1f5f9;">
                                <td class="text-end fw-bold fs-6">รวมคะแนนของคณะกรรมการ (นำไปคิดสัดส่วน 60 คะแนนสุทธิในระบบ)</td>
                                <td class="score-box fs-6 fw-bold"><span class="score-input-line"></span> / 100</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="signature-grid">
                        <div class="signature-box">
                            <p class="mb-1">ลงชื่อกรรมการผู้ประเมิน</p>
                            <div class="signature-line"></div>
                            <p class="mb-0 small">(.......................................................................)</p>
                            <p class="small text-muted">ตำแหน่ง คณะกรรมการประเมินผลการปฏิบัติหน้าที่</p>
                        </div>
                        <div class="signature-box">
                            <p class="mb-1">ลงชื่อประธานกรรมการ</p>
                            <div class="signature-line"></div>
                            <p class="mb-0 small">(.......................................................................)</p>
                            <p class="small text-muted">ตำแหน่ง ประธานคณะกรรมการประเมินผลการปฏิบัติหน้าที่</p>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
