<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ตั้งรหัส PIN / เปลี่ยนรหัสผ่าน - PPK DriveHub</title>
  <script src="config.js"></script>
  <script>window.REQUIRE_AUTH = true; window.API_BASE_URL = CONFIG.API_BASE_URL; window.currentPage = 'change-password';</script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.js"></script>
  <link rel="stylesheet" href="common.css">
  <script src="js/api.js"></script><script src="common.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      background: var(--gradient-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      background: white;
      border-radius: 16px;
      box-shadow: var(--shadow-container);
      max-width: 460px;
      width: 100%;
      padding: 36px 30px;
    }

    h1 {
      color: var(--color-text);
      margin-bottom: 8px;
      font-size: 1.45em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    p.subtitle {
      color: var(--color-text-muted);
      margin-bottom: 22px;
      line-height: 1.55;
      font-size: 0.95em;
    }

    .form-group {
      margin-bottom: 18px;
      position: relative;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--color-text);
      font-weight: 600;
      font-size: 0.95em;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-group input {
      width: 100%;
      padding: 12px 42px 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: var(--radius-md);
      font-size: 1em;
      transition: border-color .2s;
    }

    .form-group input:focus {
      border-color: var(--color-primary);
      outline: none;
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1em;
      padding: 4px 6px;
      color: #666;
    }

    .help-hint {
      font-size: 0.85em;
      color: var(--color-text-muted);
      margin-top: 5px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--gradient-primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1.05em;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
      transition: opacity .2s;
    }

    .btn:hover {
      opacity: 0.95;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: var(--radius-md);
      display: none;
      font-size: 0.95em;
    }

    .alert-error {
      background: var(--color-bg-danger);
      color: var(--color-danger-dark);
      border: 1px solid #fecaca;
    }

    .alert-success {
      background: var(--color-bg-success);
      color: var(--color-secondary-dark);
      border: 1px solid #bbf7d0;
    }

    .badge-user {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--color-primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1.1em;
    }

    .badge-info {
      font-size: 0.9em;
      color: #1e3a8a;
    }

    .badge-info strong {
      display: block;
      color: #1e40af;
      font-size: 1.02em;
    }
  </style>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon.png">
</head>

<body>
  <div class="box">
    <div id="userBadge" class="badge-user" style="display: none;">
      <div class="badge-avatar" id="badgeAvatar">👤</div>
      <div class="badge-info">
        <strong id="badgeName">ผู้ใช้งาน</strong>
        <span id="badgeEmail"></span>
      </div>
    </div>

    <h1 id="pageTitle">🔐 ตั้งรหัส PIN / รหัสผ่านใหม่</h1>
    <p class="subtitle" id="pageSubtitle">
      เพื่อความปลอดภัยในการเข้าใช้งานครั้งแรก กรุณาตั้งรหัส PIN 6 หลัก (ตัวเลข) หรือรหัสผ่านใหม่ เพื่อใช้เข้าสู่ระบบครั้งต่อไป
    </p>

    <form id="form">
      <div class="form-group" id="oldPasswordGroup" style="display: none;">
        <label for="oldPassword">รหัสผ่านเดิม</label>
        <div class="input-wrapper">
          <input type="password" id="oldPassword" placeholder="รหัสผ่านเดิม">
          <button type="button" class="toggle-pwd-btn" onclick="toggleVisibility('oldPassword', this)">👁️</button>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword" id="newPasswordLabel">รหัส PIN ใหม่ (ตัวเลข 6-8 หลัก หรือรหัสผ่านใหม่)</label>
        <div class="input-wrapper">
          <input type="password" id="newPassword" required placeholder="เช่น 123456 (ตัวเลข 6 หลัก)" minlength="6" maxlength="30" autocomplete="new-password">
          <button type="button" class="toggle-pwd-btn" onclick="toggleVisibility('newPassword', this)">👁️</button>
        </div>
        <div class="help-hint" id="newPasswordHelp">💡 แนะนำ: ตั้งเป็นตัวเลข 6 หลัก เช่น 123456 เพื่อให้จำง่ายและกดล็อกอินสะดวก</div>
      </div>

      <div class="form-group">
        <label for="newPasswordConfirm">ยืนยันรหัส PIN / รหัสผ่านใหม่อีกครั้ง</label>
        <div class="input-wrapper">
          <input type="password" id="newPasswordConfirm" required placeholder="กรอกรหัสเดิมอีกครั้งเพื่อยืนยัน" minlength="6" maxlength="30" autocomplete="new-password">
          <button type="button" class="toggle-pwd-btn" onclick="toggleVisibility('newPasswordConfirm', this)">👁️</button>
        </div>
      </div>

      <button type="submit" class="btn" id="submitBtn">
        <span>💾</span>
        <span id="submitBtnText">บันทึกรหัส PIN และเข้าสู่ระบบ</span>
      </button>
    </form>

    <div id="msg"></div>

    <div
      style="margin-top: 24px; padding-top: 18px; border-top: 1px solid #e0e0e0; text-align: center; color: var(--color-text-muted); font-size: 0.85em;">
      <p style="margin: 0;">ระบบจัดการยานพาหนะ PPK DriveHub โรงเรียนพะเยาพิทยาคม</p>
    </div>
  </div>

  <script>
    var user = getCurrentUser();

    function toggleVisibility(inputId, btn) {
      var input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁️';
      }
    }

    if (!user && typeof API !== 'undefined') {
      user = API.getUser();
    }

    if (!user) {
      console.warn('Not authenticated');
      var msg = document.getElementById('msg');
      if (msg) {
        msg.className = 'alert-error';
        msg.textContent = 'กรุณาเข้าสู่ระบบก่อนจึงจะตั้งรหัสผ่านได้';
        msg.style.display = 'block';
      }
      setTimeout(function () { window.location.href = 'login.html'; }, 2000);
    } else {
      // Show user badge
      var userBadge = document.getElementById('userBadge');
      var badgeAvatar = document.getElementById('badgeAvatar');
      var badgeName = document.getElementById('badgeName');
      var badgeEmail = document.getElementById('badgeEmail');
      if (userBadge) {
        userBadge.style.display = 'flex';
        var dName = user.display_name || user.fullName || user.username || 'ผู้ใช้งาน';
        badgeName.textContent = dName;
        badgeEmail.textContent = user.email || user.username || '';
        badgeAvatar.textContent = dName.charAt(0);
      }

      var isForced = user.must_change_password === true || user.mustChangePassword === true;
      var oldPwdGroup = document.getElementById('oldPasswordGroup');
      var pageTitle = document.getElementById('pageTitle');
      var pageSubtitle = document.getElementById('pageSubtitle');
      var submitBtnText = document.getElementById('submitBtnText');

      if (!isForced) {
        // User voluntarily changing password from profile
        oldPwdGroup.style.display = 'block';
        document.getElementById('oldPassword').required = true;
        pageTitle.textContent = '🔑 เปลี่ยนรหัสผ่าน';
        pageSubtitle.textContent = 'กรุณาระบุรหัสผ่านเดิม และตั้งรหัส PIN หรือรหัสผ่านใหม่';
        submitBtnText.textContent = 'บันทึกการเปลี่ยนรหัสผ่าน';
      } else {
        // First-time forced PIN setup
        oldPwdGroup.style.display = 'none';
        document.getElementById('oldPassword').required = false;
        pageTitle.textContent = '🔐 ตั้งรหัส PIN เข้าใช้งานครั้งแรก';
        pageSubtitle.textContent = 'กรุณาตั้งรหัส PIN 6 หลัก (ตัวเลข) หรือรหัสผ่านใหม่ เพื่อความปลอดภัยในการเข้าใช้งาน';
        submitBtnText.textContent = 'บันทึกรหัส PIN และเข้าสู่ระบบ';
      }
    }

    document.getElementById('form').addEventListener('submit', async function (e) {
      e.preventDefault();

      if (!user) {
        var msg = document.getElementById('msg');
        msg.className = 'alert-error';
        msg.textContent = 'กรุณาเข้าสู่ระบบก่อน';
        msg.style.display = 'block';
        return;
      }

      var oldP = document.getElementById('oldPassword').value.trim();
      var newP = document.getElementById('newPassword').value.trim();
      var confirmP = document.getElementById('newPasswordConfirm').value.trim();
      var msg = document.getElementById('msg');
      var submitBtn = document.getElementById('submitBtn');

      msg.style.display = 'none';

      if (!newP) {
        msg.className = 'alert-error';
        msg.textContent = 'กรุณาระบุรหัส PIN หรือรหัสผ่านใหม่';
        msg.style.display = 'block';
        return;
      }

      if (newP !== confirmP) {
        msg.className = 'alert-error';
        msg.textContent = 'รหัส PIN / รหัสผ่านใหม่กับยืนยันไม่ตรงกัน';
        msg.style.display = 'block';
        return;
      }

      // Validate password / PIN policy
      var policyError = validatePasswordPolicy(newP);
      if (policyError) {
        msg.className = 'alert-error';
        msg.textContent = policyError;
        msg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>⏳ กำลังบันทึกข้อมูล...</span>';

      try {
        var payload = {
          old_password: oldP || '123456',
          new_password: newP,
          oldPassword: oldP || '123456',
          newPassword: newP,
          userId: user.id
        };

        var result = await API.post('/api/auth/change-password', payload);
        if (result.success) {
          // Update local session
          user.must_change_password = false;
          user.mustChangePassword = false;
          if (typeof API !== 'undefined' && API.setUser) {
            API.setUser(user);
          }

          msg.className = 'alert-success';
          msg.textContent = '🎉 ตั้งรหัส PIN เรียบร้อยแล้ว กำลังนำท่านเข้าสู่ระบบ...';
          msg.style.display = 'block';
          setTimeout(function () {
            window.location.href = 'dashboard.html';
          }, 1500);
        } else {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>💾</span><span>' + (user.must_change_password ? 'บันทึกรหัส PIN และเข้าสู่ระบบ' : 'บันทึกการเปลี่ยนรหัสผ่าน') + '</span>';
          msg.className = 'alert-error';
          msg.textContent = typeof getUserMessage !== 'undefined' ? getUserMessage(result.message) : (result.message || 'ดำเนินการไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
          msg.style.display = 'block';
        }
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>💾</span><span>บันทึกรหัส PIN และเข้าสู่ระบบ</span>';
        msg.className = 'alert-error';
        msg.textContent = typeof handleError !== 'undefined' ? handleError(err) : (err.message || 'เกิดข้อผิดพลาดในการเชื่อมต่อ');
        msg.style.display = 'block';
      }
    });
  </script>
</body>

</html>
